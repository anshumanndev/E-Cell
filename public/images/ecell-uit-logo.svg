      <path d="M-6 20H6" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
      <path d="M-4 24H4" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
      <path d="M-2 28H2" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
