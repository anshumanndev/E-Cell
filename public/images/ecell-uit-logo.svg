      <path d="M0 -34L0 -42" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <path d="M-15 -28L-22 -35" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <path d="M15 -28L22 -35" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <path d="M-24 -14L-32 -16" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <path d="M24 -14L32 -16" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

      <!-- Bulb Outer Glass Contour -->
      <path
        d="M0 -28C-10 -28 -17 -20 -17 -11C-17 -4 -13 1 -9 6V14C-9 15.5 -7.5 17 -6 17H6C7.5 17 9 15.5 9 14V6C13 1 17 -4 17 -11C17 -20 10 -28 0 -28Z"
        fill="#FEF3C7"
        stroke="#D97706"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Filament Loop -->
      <path
        d="M-5 -12C-5 -18 -2 -22 0 -22C2 -22 5 -18 5 -12"
